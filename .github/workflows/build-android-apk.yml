name: Gerar APK do Aplicativo Android LeFrio

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório (Checkout)
        uses: actions/checkout@v4

      - name: Garantir Código do Módulo Android
        run: |
          if [ ! -d "android-app" ] || [ ! -f "android-app/settings.gradle.kts" ]; then
            echo "Baixando arquivos do aplicativo Android..."
            curl -fsSL -o android-app.zip https://ais-dev-ar7bordx5nsnyiemayswdy-507910401461.us-west2.run.app/android-app.zip
            unzip -q -o android-app.zip
          fi
          echo "Verificando arquivos do android-app:"
          ls -la android-app

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Preparar Gradle Wrapper
        working-directory: ./android-app
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Compilar APK (assembleDebug)
        working-directory: ./android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK para Distribuição
        working-directory: ./android-app
        run: |
          mkdir -p build/outputs/apk/release-ready
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/release-ready/lefrio-atendimento-debug.apk

      - name: Disponibilizar APK para Download (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: lefrio-atendimento-android-apk
          path: android-app/build/outputs/apk/release-ready/lefrio-atendimento-debug.apk
          retention-days: 30
