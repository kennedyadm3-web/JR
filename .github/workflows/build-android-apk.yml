name: Gerar APK do Aplicativo Android LeFrio

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Localizar Módulo Android e Compilar APK
        run: |
          # 1. Encontra a pasta onde está o subdiretório 'app'
          APP_DIR=$(find . -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "ERRO: Pasta 'app' não encontrada no repositório."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$APP_DIR")
          echo "Projeto Android localizado em: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 2. Garante arquivos raiz de configuração ao lado da pasta 'app'
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
            echo 'rootProject.name = "LeFrioAtendimento"' >> settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false; id("com.google.gms.google-services") version "4.4.1" apply false }' > build.gradle.kts
          fi

          if [ ! -f "gradle.properties" ]; then
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > gradle.properties
            echo 'android.useAndroidX=true' >> gradle.properties
            echo 'android.nonTransitiveRClass=true' >> gradle.properties
          fi

          # 3. Garante o google-services.json com suporte a com.lefrio.atendimento e com.lefrio.atendimento.debug
          echo "Configurando google-services.json do Firebase..."
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "926113928326",
              "project_id": "ai-studio-applet-webapp-7d53b",
              "storage_bucket": "ai-studio-applet-webapp-7d53b.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:926113928326:android:b9f2918817a391c",
                  "android_client_info": {
                    "package_name": "com.lefrio.atendimento"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyChgoBhisOsMiF7NHrL73lgQYQy0SffZV8"
                  }
                ],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:926113928326:android:b9f2918817a391d",
                  "android_client_info": {
                    "package_name": "com.lefrio.atendimento.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyChgoBhisOsMiF7NHrL73lgQYQy0SffZV8"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # 4. Compila o APK com Gradle 8.5
          echo "Iniciando compilação do APK..."
          gradle assembleDebug --no-daemon --stacktrace

          # 5. Encontra e copia o APK compilado
          mkdir -p build/outputs/apk/release-ready
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi
          
          cp "$APK_FILE" build/outputs/apk/release-ready/lefrio-atendimento-debug.apk
          echo "Sucesso! APK salvo em: $(pwd)/build/outputs/apk/release-ready/lefrio-atendimento-debug.apk"
          echo "EXPORT_PATH=$(pwd)/build/outputs/apk/release-ready/lefrio-atendimento-debug.apk" >> $GITHUB_ENV

      - name: Disponibilizar APK para Download (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: lefrio-atendimento-android-apk
          path: ${{ env.EXPORT_PATH }}
          retention-days: 30
