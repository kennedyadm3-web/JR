name: Gerar APK do Aplicativo Android LeFrio

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK (assembleDebug)
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p build/outputs/apk/release-ready
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/release-ready/lefrio-atendimento-debug.apk

      - name: Disponibilizar APK para Download (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: lefrio-atendimento-android-apk
          path: android-app/build/outputs/apk/release-ready/lefrio-atendimento-debug.apk
          retention-days: 30
